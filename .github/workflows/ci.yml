name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { python: "3.11", cms: "django-cms>=4.1,<5", django: "django>=4.2,<5" }
          - { python: "3.12", cms: "django-cms>=5.0,<5.1", django: "django>=5.2,<6" }
          - { python: "3.13", cms: "django-cms==5.1.3", django: "django>=6.0,<6.2" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "${{ matrix.cms }}" "${{ matrix.django }}" -e ".[test]"
      - run: pytest -q
      - name: With djangocms-versioning
        if: matrix.python == '3.13'
        run: pip install djangocms-versioning && pytest -q --ds=tests.settings_versioning tests/test_versioning.py

  demo:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the demo image
        run: docker build -f demo/Dockerfile -t supertext-djangocms-demo .
      - name: Start the stand-in API
        run: node tests/docs/stand-in.mjs > stand-in.log 2>&1 &
      - name: Start the demo twice, check the accounts, translate the sample article
        env:
          PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: tests/demo-check.sh
      - if: failure()
        run: docker logs demo 2>&1 | tail -100; cat stand-in.log
